site_name: EEG NPSY Tutorial
site_url: https://sancamilloirccs-ondalab.github.io/tutorial_EEG-NPSY/
site_author: SanCamilloIRCCS-OndaLab
site_description: >-
  A multi-language tutorial for EEG data analysis — clinical case studies
  linking EEG/ERP features to neuropsychological outcomes, in Python, R,
  and Matlab.

repo_name: SanCamilloIRCCS-OndaLab/tutorial_EEG-NPSY
repo_url: https://github.com/SanCamilloIRCCS-OndaLab/tutorial_EEG-NPSY
edit_uri: edit/main/docs/

copyright: >
  Copyright &copy; 2025 San Camillo IRCCS — part of the
  <a href="https://sancamilloirccs-ondalab.github.io/">ONDA Lab</a>

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.png
  palette:
    - scheme: default
      primary: blue
      accent: light-blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.tabs.link       # keeps selected language tab across pages
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/lang-switch.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SanCamilloIRCCS-OndaLab/tutorial_EEG-NPSY

plugins:
  - search
  - glightbox   # image zoom on click
  - mkdocs-jupyter:
      include_source: True
      execute: False

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true   # enables === "Tab" syntax
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting_started/installation.md
      - Data: getting_started/data.md
      - Repository Structure: getting_started/structure.md
  - Case Study 1:
      - Overview: case_studies/case_study_1.md
      - Code: case_studies/case_study_1_notebook.ipynb
      - Code (R): case_studies/case_study_1_notebook_r.ipynb
  - Case Study 2:
      - Overview: case_studies/case_study_2.md
      - Notebook (Python): case_studies/case_study_2_notebook.ipynb
  - About:
      - Citation: about/citation.md
      - Contributing: about/contributing.md
      - Changelog: about/changelog.md
