site_name: EEG NPSY Tutorial
site_author: "[REDACTED]"
site_description: >-
  A multi-language tutorial for EEG data analysis — clinical case studies
  linking EEG/ERP features to neuropsychological outcomes, in Python, R,
  and Matlab.

copyright: "Copyright &copy; 2025 [REDACTED]"

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.png
  palette:
    - scheme: default
      primary: blue
      accent: light-blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.tabs.link       # keeps selected language tab across pages
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/lang-switch.js
  - javascripts/section-nav.js

plugins:
  - search
  - glightbox   # image zoom on click
  - mkdocs-jupyter:
      include_source: True
      execute: False
      ignore_h1_titles: True   # keep the "Code" nav label, don't override it with the notebook's own H1
      ignore:
        - "*/case_studies/scripts/*.py"   # plain-script downloads, not jupytext notebooks - copy verbatim, don't render as pages

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true   # enables === "Tab" syntax
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [".."]   # repo root, so snippets can embed files like matlab/case1/code/CaseStudy_1.m
      check_paths: true   # fail the build on a bad snippet path instead of silently rendering nothing
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting_started/installation.md
      - Data: getting_started/data.md
      - Repository Structure: getting_started/structure.md
  - Case Study 1:
      - Overview: case_studies/case_study_1.md
      - Code: case_studies/case_study_1/python.ipynb
  - Case Study 2:
      - Overview: case_studies/case_study_2.md
      - Code: case_studies/case_study_2/python.ipynb
  - About:
      - Citation: about/citation.md
      - Contributing: about/contributing.md
      - Changelog: about/changelog.md
